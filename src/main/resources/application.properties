spring.application.name=insuscan
server.port=9693

# Firebase configuration
# Place your Firebase service account JSON file in src/main/resources/
firebase.config.path=firebase-service-account.json
firebase.project.id=${FIREBASE_PROJECT_ID:insuscan-1567c}

# Logging configuration
logging.level.org.springframework.web=debug
logging.level.com.google.firebase=info

# InsuScan custom logging
logging.level.com.insuscan=debug

# Suppress commons-logging warning
logging.level.org.apache.commons.logging=ERROR

# Enable demo data generation on startup
spring.profiles.active=default

# DEV ONLY - remove before production, change back to: spring.profiles.active=default
#spring.profiles.active=dev

# External API configuration
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini

# Gemini AI configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model.vision=gemini-3.1-pro-preview
gemini.model.flash=gemini-3-flash-preview

insuscan.usda.api.key=${USDA_API_KEY:}

# Plate geometry configuration
plate.geometry.debug.override=false
plate.geometry.debug.diameter=22.0
plate.geometry.debug.depth=2.0

plate.geometry.sizes.small=18.0
plate.geometry.sizes.standard=22.0
plate.geometry.sizes.large=26.0
plate.geometry.confidence.threshold=0.85
# Plausible diameter range (14-34cm) is a safety check, not tunable see StandardPlateConfig

calibration.crosscheck.max-gap=0.25

# Insulin calculation defaults
insuscan.insulin.default-ratio=1:10
insuscan.insulin.max-dose-warning=20


calibration.debug.dump-dir=/app/debug
calibration.cv.close-kernel-px=15
calibration.cv.region-margin-ratio=0.5
calibration.strict.aspect-tolerance=0.5

calibration.cv.cluster-merge-ratio=0.05



# API Debug logging - shows detailed API calls
logging.level.API_DEBUG=INFO

#-----------
# Banner / startup output
spring.main.banner-mode=console
spring.banner.location=classpath:banner.txt
spring.output.ansi.enabled=ALWAYS
spring.main.log-startup-info=false



